name: Drizzlet Hygrostat site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: insolentconstruct/eurorack
          ref: drizzlet
          path: firmware
          fetch-depth: 0
      - name: The pinned images still encode to their release files
        env:
          FIRMWARE_REPO: ./firmware
        run: |
          node --version
          git -C firmware submodule update --init --depth=1 stmlib
          node test/manifest.js
          node test/profile.js
          node test/scales.js
          node test/scales_firmware.js
          node test/downloads.js
          node test/help.js
          node test/layout.js
          node test/readiness.js
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { fileURLToPath } from "node:url";
            import { execFileSync } from "node:child_process";
            const root = new URL("./static/", import.meta.url);
            for (const r of JSON.parse(readFileSync(new URL("manifest.json", root))).releases) {
              if (!r.wav_sha256) {
                console.log(`${r.tag}: no release WAV hash in manifest; golden check unavailable`);
                continue;
              }
              execFileSync(process.execPath, ["test/golden.js",
                fileURLToPath(new URL(r.app, root)), r.wav_sha256], { stdio: "inherit" });
            }'
      - name: Install the pinned Hugo
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "$HUGO_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
      - name: Build the site
        run: |
          "$RUNNER_TEMP/hugo" version
          "$RUNNER_TEMP/hugo" --source . --destination "$PWD/public" --panicOnWarning
          # Served byte for byte as in the repository.
          diff -r static public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  browser:
    # The page in Chromium, Firefox and WebKit, served locally; nothing is deployed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the Playwright matching the image
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2
      - name: The page works in three browsers
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 -d static >/dev/null 2>&1 &
          for i in $(seq 50); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
          SITE=static BASE=http://127.0.0.1:8080/ node test/browser.mjs
          SITE=static BASE=http://127.0.0.1:8080/ node test/scales_browser.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
